<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <script>
      // Browser extension compatibility shim for environments where window.fetch only has a getter
      try {
        if (typeof window !== 'undefined' && window.fetch) {
          var _origFetch = window.fetch;
          var _activeFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function () { return _activeFetch; },
            set: function (fn) { _activeFetch = fn; },
            configurable: true,
            enumerable: true
          });
        }
      } catch (e) {}

      // Ignore HMR / dev WebSocket closure notices and transient Firestore connection notices in iframe / proxy environment
      if (typeof window !== 'undefined') {
        window.addEventListener('unhandledrejection', function (e) {
          var str = String(e.reason?.message || e.reason || '');
          if (
            str.includes('WebSocket') ||
            str.includes('Could not reach Cloud Firestore') ||
            str.includes('code=unavailable') ||
            str.includes('The operation could not be completed')
          ) {
            e.preventDefault();
          }
        });
        window.addEventListener('error', function (e) {
          var str = String(e.message || '');
          if (
            str.includes('WebSocket') ||
            str.includes('Could not reach Cloud Firestore') ||
            str.includes('code=unavailable') ||
            str.includes('The operation could not be completed')
          ) {
            e.preventDefault();
          }
        });
      }

      // React Fast Refresh Preamble compatibility flag
      window.__vite_plugin_react_preamble_installed__ = true;
      window.$RefreshReg$ = window.$RefreshReg$ || function () {};
      window.$RefreshSig$ = window.$RefreshSig$ || function () { return function (type) { return type; }; };
    </script>
    <script type="module">
      try {
        const r = await import('/@react-refresh');
        const RefreshRuntime = r.default || r;
        if (RefreshRuntime && RefreshRuntime.injectIntoGlobalHook) {
          RefreshRuntime.injectIntoGlobalHook(window);
          window.$RefreshReg$ = () => {};
          window.$RefreshSig$ = () => (type) => type;
          window.__vite_plugin_react_preamble_installed__ = true;
        }
      } catch (e) {
        window.__vite_plugin_react_preamble_installed__ = true;
      }
    </script>
    <title>GA Workspace — Growth Alliance Consultancy</title>
    <meta name="description" content="Growth Alliance Consultancy employee and administration workspace." />
    <meta name="theme-color" content="#0f293c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GA Workspace" />
    
    <!-- OpenGraph & Social Cards -->
    <meta property="og:title" content="GA Workspace — Growth Alliance Consultancy" />

    <!-- Google Fonts for Typography matching Figma Workspace design -->

  </head>

  </body>
